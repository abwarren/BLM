<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLM V2 — Replay</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    /* ── Replay-specific styles ──────────────────────────────── */

    .replay-layout {
      display: grid;
      grid-template-areas:
        "timeline   timeline"
        "controls   controls"
        "signals    chart";
      grid-template-columns: 300px 1fr;
      grid-template-rows: auto auto 1fr;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-deepest);
    }

    .replay-layout {
      --bg-deepest: #050812;
      --bg-default: #0b1020;
      --bg-elevated: #111827;
      --bg-card: #0f1628;
      --bg-card-hover: #1a2235;
      --bg-input: #1a2235;
      --border-default: #1e2745;
      --border-subtle: #161f35;
      --border-accent: #2a3560;
      --text-primary: #e2e8f0;
      --text-secondary: #8892b0;
      --text-muted: #4a5570;
      --brand-primary: #00d4ff;
      --brand-secondary: #7c3aed;
      --transition-fast: all 0.15s ease;
    }

    /* Timeline */
    .timeline-bar {
      grid-area: timeline;
      padding: 12px 20px;
      background: var(--bg-default);
      border-bottom: 1px solid var(--border-default);
    }

    .timeline-container {
      position: relative;
      width: 100%;
      height: 36px;
      cursor: pointer;
    }

    .timeline-track {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--bg-input);
      border-radius: 2px;
      transform: translateY(-50%);
    }

    .timeline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .timeline-thumb {
      position: absolute;
      top: 50%;
      width: 16px;
      height: 16px;
      background: var(--brand-primary);
      border: 2px solid var(--bg-deepest);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
      transition: left 0.1s linear;
      z-index: 2;
      cursor: grab;
    }

    .timeline-thumb:active { cursor: grabbing; }

    .quarter-markers {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    .quarter-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(85, 96, 122, 0.5);
    }

    .quarter-marker-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timeline-info {
      display: flex;
      justify-content: space-between;
      margin-top: 22px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Controls */
    .controls-bar {
      grid-area: controls;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-default);
    }

    .control-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-default);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .control-btn:hover {
      border-color: var(--border-accent);
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }

    .control-btn.primary {
      background: rgba(0, 212, 255, 0.1);
      border-color: var(--brand-primary);
      color: var(--brand-primary);
    }

    .control-btn.primary:hover { background: rgba(0, 212, 255, 0.2); }
    .control-btn:active { transform: scale(0.96); }

    .control-divider {
      width: 1px;
      height: 24px;
      background: var(--border-default);
      margin: 0 4px;
    }

    .speed-indicator {
      padding: 4px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--brand-primary);
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 4px;
      margin-left: auto;
    }

    .frame-counter {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: 12px;
    }

    /* ═══ Signals Panel (replaces old score panel) ═══ */
    .signals-panel {
      grid-area: signals;
      padding: 8px;
      background: var(--bg-default);
      border-right: 1px solid var(--border-default);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Score card at top of signals panel */
    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .panel-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .panel-value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .score-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-display .home { color: var(--brand-primary); }
    .score-display .away { color: #f97316; }
    .score-display .vs { color: var(--text-muted); font-size: 0.9rem; }
    .score-margin {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Gauge for trap meter */
    .gauge {
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .gauge-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    .gauge.gauge-low .gauge-fill { background: var(--brand-primary); }
    .gauge.gauge-mid .gauge-fill { background: #f59e0b; }
    .gauge.gauge-high .gauge-fill { background: #ef4444; }
    .gauge-number { font-size: 0.95rem; font-weight: 700; }

    /* Signal legend */
    .signal-legend { }
    .signal-legend-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .signal-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 240px;
      overflow-y: auto;
    }

    .signal-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: var(--bg-elevated);
      border-left: 3px solid transparent;
      transition: background 0.15s ease, opacity 0.3s ease;
    }

    .signal-item.active {
      background: var(--bg-card-hover);
    }

    .signal-item.inactive {
      opacity: 0.35;
    }

    .signal-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .signal-icon.signal-trap { background: #ef4444; }
    .signal-icon.signal-bull { background: #f97316; }
    .signal-icon.signal-bear { background: #ec4899; }
    .signal-icon.signal-dead-market { background: #6b7280; }
    .signal-icon.signal-momentum { background: #22c55e; }
    .signal-icon.signal-confidence { background: #3b82f6; }
    .signal-icon.signal-correction { background: #7c3aed; }
    .signal-icon.signal-sharp { background: #f59e0b; }
    .signal-icon.signal-three { background: #06b6d4; }

    .signal-name {
      flex: 1;
      color: var(--text-secondary);
    }

    .signal-value {
      font-weight: 600;
      font-size: 0.7rem;
      min-width: 32px;
      text-align: right;
    }

    .signal-value.val-trap { color: #ef4444; }
    .signal-value.val-bull { color: #f97316; }
    .signal-value.val-bear { color: #ec4899; }
    .signal-value.val-dead { color: #6b7280; }
    .signal-value.val-momentum { color: #22c55e; }
    .signal-value.val-confidence { color: #3b82f6; }
    .signal-value.val-correction { color: #7c3aed; }
    .signal-value.val-sharp { color: #f59e0b; }

    /* Active signals count badge */
    .signal-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .signal-count-badge .count {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      padding: 0 6px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.7rem;
    }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--bg-input);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: var(--brand-primary);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    /* Speed button active state */
    .control-btn.speed-active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--brand-primary);
      color: var(--brand-primary);
    }
    .control-btn.q-active {
      background: rgba(124, 58, 237, 0.15);
      border-color: var(--brand-secondary);
      color: var(--brand-secondary);
    }

    /* Chart panel */
    .replay-chart-panel {
      grid-area: chart;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .replay-chart-container {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 8px;
      position: relative;
    }

    .replay-chart-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .position-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--brand-primary);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
      pointer-events: none;
      z-index: 10;
      transition: left 0.1s linear;
    }

    /* Signal tooltip overlay */
    .signal-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 17, 28, 0.95);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 20;
    }

    .signal-dot:hover .signal-tooltip {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="replay-layout">
    <!-- ═══ TIMELINE BAR ═══ -->
    <div class="timeline-bar">
      <div class="timeline-container" id="timelineContainer">
        <div class="timeline-track"></div>
        <div class="timeline-fill" id="timelineFill" style="width: 0%"></div>
        <div class="quarter-markers" id="quarterMarkers"></div>
        <div class="timeline-thumb" id="timelineThumb" style="left: 0%"></div>
      </div>
      <div class="timeline-info">
        <span id="timelineClock">Q1 12:00</span>
        <span id="frameCounter">Frame 0 of 0</span>
      </div>
    </div>

    <!-- ═══ CONTROLS ═══ -->
    <div class="controls-bar">
      <button class="control-btn" id="btnRewind2" title="Rewind 2x">⏪ 2x</button>
      <button class="control-btn" id="btnRewind4" title="Rewind 4x">⏪ 4x</button>
      <button class="control-btn" id="btnRewind8" title="Rewind 8x">⏪ 8x</button>
      <div class="control-divider"></div>
      <button class="control-btn" id="btnStepBack" title="Step Back">◀</button>
      <button class="control-btn primary" id="btnPlayPause">▶ Play</button>
      <button class="control-btn" id="btnStepFwd" title="Step Forward">▶</button>
      <div class="control-divider"></div>
      <button class="control-btn" id="btnFwd2" title="Fast Forward 2x">2x ▶▶</button>
      <button class="control-btn" id="btnFwd4" title="Fast Forward 4x">4x ▶▶</button>
      <button class="control-btn" id="btnFwd8" title="Fast Forward 8x">8x ▶▶</button>
      <div class="control-divider"></div>
      <button class="control-btn" id="btnQ1">Q1</button>
      <button class="control-btn" id="btnQ2">Q2</button>
      <button class="control-btn" id="btnQ3">Q3</button>
      <button class="control-btn" id="btnQ4">Q4</button>
      <button class="control-btn" id="btnOT">OT</button>
      <div class="speed-indicator" id="speedIndicator">1.0x</div>
      <span class="frame-counter" id="frameCounterLabel">Frame 0 / 0</span>
    </div>

    <!-- ═══ SIGNALS PANEL (left sidebar) ═══ -->
    <aside class="signals-panel" id="signalsPanel">
      <!-- Score card -->
      <div class="panel-card">
        <div class="panel-label">Current Score</div>
        <div class="score-display">
          <span class="home" id="replayHomeScore">0</span>
          <span class="vs">vs</span>
          <span class="away" id="replayAwayScore">0</span>
        </div>
        <div class="score-margin" id="replayScoreDetail">Margin: 0</div>
      </div>

      <!-- BLM card -->
      <div class="panel-card">
        <div class="panel-label">BLM Assessment</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="panel-value" id="replayBlmScore" style="font-size:1.1rem;">--</span>
          <span style="font-size:0.72rem;color:var(--text-muted);" id="replayConfidence">--% conf</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-secondary);margin-top:4px;">
          <span>Win: <strong id="replayWinProb">--</strong></span>
          <span>Total: <strong id="replayExpectedTotal">--</strong></span>
          <span>Margin: <strong id="replayExpectedMargin">--</strong></span>
        </div>
      </div>

      <!-- Trap meter card -->
      <div class="panel-card">
        <div class="panel-label">Trap Meter</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="gauge-number" id="replayTrapMeter">0%</span>
          <span style="font-size:0.68rem;color:var(--text-muted);">
            <span id="signalCountBadge" class="signal-count-badge">
              Signals: <span class="count" id="activeSignalCount">0</span>
            </span>
          </span>
        </div>
        <div class="gauge gauge-low" id="replayTrapGauge">
          <div class="gauge-fill" id="replayTrapFill" style="width:0%"></div>
        </div>
      </div>

      <!-- Visual Signal Legend -->
      <div class="panel-card signal-legend">
        <div class="signal-legend-title">Visual Signals <span style="font-weight:400;color:var(--text-muted);font-size:0.65rem;">(in-play indicators)</span></div>
        <div class="signal-list" id="signalList"></div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="replayProgress" style="width:0%"></div>
      </div>
    </aside>

    <!-- ═══ CHART PANEL ═══ -->
    <main class="replay-chart-panel">
      <div class="replay-chart-container">
        <canvas id="replayChart"></canvas>
        <div class="position-marker" id="positionMarker" style="left:0%"></div>
      </div>
    </main>
  </div>

  <script>
    // ── Replay Application ──────────────────────────────────────────

    (function () {
      'use strict';

      // ═══════════════════════════════════════════════════════════════
      // SIGNAL CONFIGURATION
      // ═══════════════════════════════════════════════════════════════

      const SIGNAL_DEFS = [
        { id: 'trap_meter',      label: 'Trap Meter ≥70%',      icon: 'signal-trap',      valueClass: 'val-trap',      threshold: 0.70, fieldPath: 'trap_detection.trap_meter' },
        { id: 'bull_trap',       label: 'Bull Trap',            icon: 'signal-bull',      valueClass: 'val-bull',      threshold: 0.50, fieldPath: 'trap_detection.bull_trap' },
        { id: 'bear_trap',       label: 'Bear Trap',            icon: 'signal-bear',      valueClass: 'val-bear',      threshold: 0.50, fieldPath: 'trap_detection.bear_trap' },
        { id: 'dead_market',     label: 'Dead Market',          icon: 'signal-dead-market', valueClass: 'val-dead',    threshold: 0.50, fieldPath: 'trap_detection.dead_market' },
        { id: 'sharp_trap',      label: 'Sharp Money',          icon: 'signal-sharp',     valueClass: 'val-sharp',     threshold: 0.50, fieldPath: 'trap_detection.sharp_trap' },
        { id: 'momentum_swing',  label: 'Momentum Shift',       icon: 'signal-momentum',  valueClass: 'val-momentum',  threshold: null,  deriveFn: 'momentumSwing' },
        { id: 'confidence_drop', label: 'Confidence Drop',      icon: 'signal-confidence', valueClass: 'val-confidence', threshold: null, deriveFn: 'confidenceDrop' },
        { id: 'model_correction',label: 'Model Correction',     icon: 'signal-correction',valueClass: 'val-correction', threshold: null, deriveFn: 'modelCorrection' },
      ];

      // ── State ──────────────────────────────────────────────────

      const API_BASE = '/api/v2';

      let gameId = null;
      let allFrames = [];
      let currentFrameIndex = 0;
      let isPlaying = false;
      let currentSpeed = 1;
      let playTimer = null;
      let replayChart = null;

      // Pre-computed signals across all frames
      let signalMap = {};
      let frameSignalCache = [];
      let activeSignalsAtFrame = [];

      // DOM refs
      const $ = function (id) { return document.getElementById(id); };

      const dom = {
        timelineContainer: $('timelineContainer'),
        timelineFill: $('timelineFill'),
        timelineThumb: $('timelineThumb'),
        quarterMarkers: $('quarterMarkers'),
        timelineClock: $('timelineClock'),
        frameCounter: $('frameCounter'),
        frameCounterLabel: $('frameCounterLabel'),
        speedIndicator: $('speedIndicator'),
        replayProgress: $('replayProgress'),

        replayHomeScore: $('replayHomeScore'),
        replayAwayScore: $('replayAwayScore'),
        replayScoreDetail: $('replayScoreDetail'),
        replayBlmScore: $('replayBlmScore'),
        replayTrapMeter: $('replayTrapMeter'),
        replayTrapGauge: $('replayTrapGauge'),
        replayTrapFill: $('replayTrapFill'),
        replayConfidence: $('replayConfidence'),
        replayWinProb: $('replayWinProb'),
        replayExpectedTotal: $('replayExpectedTotal'),
        replayExpectedMargin: $('replayExpectedMargin'),
        signalList: $('signalList'),
        activeSignalCount: $('activeSignalCount'),

        btnPlayPause: $('btnPlayPause'),
        btnStepBack: $('btnStepBack'),
        btnStepFwd: $('btnStepFwd'),
        btnFwd2: $('btnFwd2'),
        btnFwd4: $('btnFwd4'),
        btnFwd8: $('btnFwd8'),
        btnRewind2: $('btnRewind2'),
        btnRewind4: $('btnRewind4'),
        btnRewind8: $('btnRewind8'),
        btnQ1: $('btnQ1'),
        btnQ2: $('btnQ2'),
        btnQ3: $('btnQ3'),
        btnQ4: $('btnQ4'),
        btnOT: $('btnOT'),

        positionMarker: $('positionMarker'),
        replayChartCanvas: $('replayChart'),
      };

      // ── Helper Functions ──────────────────────────────────────

      function safeGet(obj, path, fallback) {
        return path.split('.').reduce(function (acc, key) {
          return (acc && typeof acc === 'object' && key in acc) ? acc[key] : fallback;
        }, obj);
      }

      function toPct(val) {
        if (val === null || val === undefined) return '--';
        return (val * 100).toFixed(1) + '%';
      }

      function toFixed(val, digits) {
        if (digits === undefined) digits = 1;
        if (val === null || val === undefined) return '--';
        return Number(val).toFixed(digits);
      }

      function computeGameMinutes(frame) {
        var q = safeGet(frame, 'metadata.quarter', 1);
        var clock = safeGet(frame, 'metadata.clock', '12:00');
        var gm = (q - 1) * 12;
        if (clock && clock !== '--') {
          var parts = clock.split(':');
          var mins = parseInt(parts[0], 10);
          var secs = parseInt(parts[1], 10);
          gm += (12 - mins - 1) + (60 - secs) / 60;
        }
        return gm;
      }

      // ── Signal Detection Engine ──────────────────────────────

      function detectSignals(frames) {
        signalMap = {};
        frameSignalCache = [];

        if (!frames || frames.length < 2) return;

        for (var i = 0; i < frames.length; i++) {
          var frame = frames[i];
          var signals = [];

          // 1. Trap-based signals (threshold check)
          var trapMeter = safeGet(frame, 'trap_detection.trap_meter', 0);
          if (trapMeter >= 0.70) signals.push({ id: 'trap_meter', value: trapMeter, severity: trapMeter >= 0.85 ? 'high' : 'mid' });

          var bullTrap = safeGet(frame, 'trap_detection.bull_trap', 0);
          if (bullTrap >= 0.50) signals.push({ id: 'bull_trap', value: bullTrap, severity: bullTrap >= 0.7 ? 'high' : 'mid' });

          var bearTrap = safeGet(frame, 'trap_detection.bear_trap', 0);
          if (bearTrap >= 0.50) signals.push({ id: 'bear_trap', value: bearTrap, severity: bearTrap >= 0.7 ? 'high' : 'mid' });

          var deadMarket = safeGet(frame, 'trap_detection.dead_market', 0);
          if (deadMarket >= 0.50) signals.push({ id: 'dead_market', value: deadMarket, severity: deadMarket >= 0.7 ? 'high' : 'mid' });

          var sharpTrap = safeGet(frame, 'trap_detection.sharp_trap', 0);
          if (sharpTrap >= 0.50) signals.push({ id: 'sharp_trap', value: sharpTrap, severity: sharpTrap >= 0.7 ? 'high' : 'mid' });

          var lateTrap = safeGet(frame, 'trap_detection.late_trap', 0);
          if (lateTrap >= 0.50) signals.push({ id: 'late_trap', value: lateTrap, severity: lateTrap >= 0.7 ? 'high' : 'mid' });

          // 2. Momentum swing (velocity change between frames)
          if (i > 0) {
            var prevMom = safeGet(frames[i-1], 'momentum.momentum_velocity', 0);
            var currMom = safeGet(frame, 'momentum.momentum_velocity', 0);
            var swingMag = Math.abs(currMom - prevMom);
            if (swingMag > 1.5) {
              signals.push({ id: 'momentum_swing', value: swingMag, severity: swingMag > 3.0 ? 'high' : 'mid' });
            }
          }

          // 3. Confidence drop
          if (i > 0) {
            var prevConf = safeGet(frames[i-1], 'blm.confidence', 0.5);
            var currConf = safeGet(frame, 'blm.confidence', 0.5);
            var confDrop = prevConf - currConf;
            if (confDrop > 0.15) {
              signals.push({ id: 'confidence_drop', value: confDrop, severity: confDrop > 0.3 ? 'high' : 'mid' });
            }
          }

          // 4. Model correction (large swing in expected_margin between frames)
          if (i > 0) {
            var prevMargin = safeGet(frames[i-1], 'blm.expected_margin', null);
            var currMargin = safeGet(frame, 'blm.expected_margin', null);
            if (prevMargin !== null && currMargin !== null) {
              var marginShift = Math.abs(currMargin - prevMargin);
              if (marginShift > 3.0) {
                signals.push({ id: 'model_correction', value: marginShift, severity: marginShift > 6.0 ? 'high' : 'mid' });
              }
            }
          }

          signalMap[i] = signals;
          frameSignalCache.push(signals);
        }
      }

      // ── API Calls ─────────────────────────────────────────────

      function loadGameReplay(gameIdParam) {
        return fetch(API_BASE + '/replay/' + gameIdParam)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load replay: ' + res.status);
            return res.json();
          });
      }

      function loadGameDetail(gameIdParam) {
        return fetch(API_BASE + '/game/' + gameIdParam)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load game: ' + res.status);
            return res.json();
          });
      }

      function loadGamesList() {
        return fetch(API_BASE + '/games')
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load games list');
            return res.json();
          });
      }

      // ── Signal Legend Rendering ──────────────────────────────

      function buildSignalLegend() {
        dom.signalList.innerHTML = '';
        SIGNAL_DEFS.forEach(function (def) {
          var item = document.createElement('div');
          item.className = 'signal-item inactive';
          item.id = 'sig-' + def.id;

          var icon = document.createElement('span');
          icon.className = 'signal-icon ' + def.icon;

          var name = document.createElement('span');
          name.className = 'signal-name';
          name.textContent = def.label;

          var value = document.createElement('span');
          value.className = 'signal-value ' + def.valueClass;
          value.id = 'sig-val-' + def.id;
          value.textContent = '--';

          item.appendChild(icon);
          item.appendChild(name);
          item.appendChild(value);
          dom.signalList.appendChild(item);
        });
      }

      function updateSignalLegend(frameIndex) {
        var signals = frameSignalCache[frameIndex] || [];
        var activeCount = 0;

        // Reset all to inactive
        SIGNAL_DEFS.forEach(function (def) {
          var el = document.getElementById('sig-' + def.id);
          if (el) {
            el.className = 'signal-item inactive';
          }
          var valEl = document.getElementById('sig-val-' + def.id);
          if (valEl) valEl.textContent = '--';
        });

        // Activate current signals
        signals.forEach(function (sig) {
          var el = document.getElementById('sig-' + sig.id);
          if (el) {
            el.className = 'signal-item active';
            if (sig.severity === 'high') {
              el.style.borderLeftColor = '#ef4444';
            } else {
              el.style.borderLeftColor = '#f59e0b';
            }
          }
          var valEl = document.getElementById('sig-val-' + sig.id);
          if (valEl) {
            valEl.textContent = (sig.value * 100).toFixed(0) + '%';
          }
          activeCount++;
        });

        dom.activeSignalCount.textContent = activeCount;
        activeSignalsAtFrame = signals;
      }

      // ── Frame Display ─────────────────────────────────────────

      function displayFrame(index) {
        if (!allFrames.length || index < 0 || index >= allFrames.length) return;

        currentFrameIndex = index;
        var data = allFrames[index];

        // Update timeline
        var pct = (index / (allFrames.length - 1)) * 100;
        dom.timelineFill.style.width = pct + '%';
        dom.timelineThumb.style.left = pct + '%';
        dom.replayProgress.style.width = pct + '%';

        // Frame counter
        dom.frameCounter.textContent = 'Frame ' + (index + 1) + ' of ' + allFrames.length;
        dom.frameCounterLabel.textContent = 'Frame ' + (index + 1) + ' / ' + allFrames.length;

        // Extract data
        var homeTeam = safeGet(data, 'game_state.home_team', 'Home');
        var awayTeam = safeGet(data, 'game_state.away_team', 'Away');
        var homeScore = safeGet(data, 'game_state.home_score', 0);
        var awayScore = safeGet(data, 'game_state.away_score', 0);
        var quarter = safeGet(data, 'metadata.quarter', 1);
        var clock = safeGet(data, 'metadata.clock', '12:00');
        var margin = safeGet(data, 'game_state.margin', 0);

        // Score panel
        dom.replayHomeScore.textContent = homeScore;
        dom.replayAwayScore.textContent = awayScore;
        dom.replayScoreDetail.textContent = 'Margin: ' + (margin > 0 ? '+' : '') + margin + '  |  Q' + quarter + ' ' + clock;
        dom.timelineClock.textContent = 'Q' + quarter + ' ' + clock;

        // BLM Score
        var blmScore = safeGet(data, 'blm.blm_score') || safeGet(data, 'blm.expected_margin');
        dom.replayBlmScore.textContent = toFixed(blmScore);

        // Trap Meter
        var trapMeter = safeGet(data, 'trap_detection.trap_meter', 0);
        var trapPct = Math.round(trapMeter * 100);
        dom.replayTrapMeter.textContent = trapPct + '%';
        dom.replayTrapFill.style.width = trapPct + '%';
        dom.replayTrapGauge.className = 'gauge';
        if (trapPct >= 80) dom.replayTrapGauge.classList.add('gauge-high');
        else if (trapPct >= 50) dom.replayTrapGauge.classList.add('gauge-mid');
        else dom.replayTrapGauge.classList.add('gauge-low');

        // Confidence
        var confidence = safeGet(data, 'blm.confidence', 0);
        dom.replayConfidence.textContent = toPct(confidence);

        // Win Probability
        var winProb = safeGet(data, 'blm.win_probability', null);
        dom.replayWinProb.textContent = toPct(winProb);

        // Expected Total
        var expTotal = safeGet(data, 'blm.expected_total', null);
        dom.replayExpectedTotal.textContent = toFixed(expTotal);

        // Expected Margin
        var expMargin = safeGet(data, 'blm.expected_margin', null);
        dom.replayExpectedMargin.textContent = toFixed(expMargin);

        // Update signal legend
        updateSignalLegend(index);

        // Update position marker on chart
        updatePositionMarker();
      }

      // ── Chart ──────────────────────────────────────────────────

      function initReplayChart() {
        var ctx = dom.replayChartCanvas.getContext('2d');

        Chart.register(chartjsAnnotation);

        replayChart = new Chart(ctx, {
          type: 'scatter',
          data: {
            datasets: [{
              label: 'BLM Score',
              data: [],
              borderColor: '#00d4ff',
              backgroundColor: 'rgba(0, 212, 255, 0.1)',
              showLine: true,
              tension: 0.2,
              pointRadius: 1.5,
              pointHoverRadius: 4,
              borderWidth: 2,
              fill: true,
              order: 2,
            }, {
              label: 'Trap Meter',
              data: [],
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.05)',
              showLine: true,
              tension: 0.2,
              pointRadius: 1,
              pointHoverRadius: 3,
              borderWidth: 1,
              borderDash: [4, 3],
              yAxisID: 'y1',
              order: 2,
            }, {
              label: '⚡ Signals',
              data: [],
              backgroundColor: [],
              pointBackgroundColor: [],
              pointRadius: 8,
              pointHoverRadius: 10,
              pointStyle: 'triangle',
              showLine: false,
              order: 1,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              legend: {
                labels: {
                  color: '#8892b0',
                  font: { size: 11 },
                  usePointStyle: true,
                },
              },
              tooltip: {
                backgroundColor: 'rgba(13, 17, 28, 0.95)',
                titleColor: '#e8edf5',
                bodyColor: '#8892b0',
                borderColor: '#1e2745',
                borderWidth: 1,
                padding: 8,
                callbacks: {
                  label: function (ctx) {
                    if (ctx.datasetIndex === 2 && ctx.raw && ctx.raw.signalInfo) {
                      return '⚠ ' + ctx.raw.signalInfo;
                    }
                    return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1);
                  }
                }
              },
              annotation: {
                annotations: {},
              },
            },
            scales: {
              x: {
                type: 'linear',
                title: {
                  display: true,
                  text: 'Game Time (minutes)',
                  color: '#55607a',
                },
                ticks: { color: '#55607a' },
                grid: { color: 'rgba(30, 39, 69, 0.5)' },
                min: 0,
              },
              y: {
                position: 'left',
                title: {
                  display: true,
                  text: 'Score / Model Value',
                  color: '#55607a',
                },
                ticks: { color: '#55607a' },
                grid: { color: 'rgba(30, 39, 69, 0.3)' },
              },
              y1: {
                position: 'right',
                min: 0,
                max: 1,
                title: {
                  display: true,
                  text: 'Trap',
                  color: '#55607a',
                },
                ticks: {
                  color: '#55607a',
                  callback: function (v) { return (v * 100).toFixed(0) + '%'; },
                },
                grid: { drawOnChartArea: false },
              },
            },
          },
        });

        return replayChart;
      }

      function buildChartData() {
        if (!replayChart || !allFrames.length) return;

        var blmData = [];
        var trapData = [];
        var signalData = [];

        allFrames.forEach(function (frame, i) {
          var gameMinutes = computeGameMinutes(frame);
          var blmScore = safeGet(frame, 'blm.blm_score') || safeGet(frame, 'blm.expected_margin') || 0;
          var trapMeter = safeGet(frame, 'trap_detection.trap_meter', 0);

          blmData.push({ x: gameMinutes, y: blmScore });
          trapData.push({ x: gameMinutes, y: trapMeter });

          // Add signal markers for high-severity events
          var signals = signalMap[i] || [];
          var hasHighSignal = signals.some(function (s) { return s.severity === 'high'; });
          var hasMidSignal = signals.some(function (s) { return s.severity === 'mid'; });

          if (hasHighSignal || hasMidSignal) {
            var severityCount = signals.filter(function (s) { return s.severity === 'high'; }).length;
            var totalCount = signals.length;
            var signalLabels = signals.map(function (s) { return s.id; }).join(', ');

            var point = {
              x: gameMinutes,
              y: blmScore,
              signalInfo: totalCount + ' signal(s): ' + signalLabels,
            };

            // Color by worst severity
            if (severityCount > 0) {
              point.pointBackgroundColor = '#ef4444'; // red for high
            } else {
              point.pointBackgroundColor = '#f59e0b'; // amber for mid
            }

            signalData.push(point);
          }
        });

        replayChart.data.datasets[0].data = blmData;
        replayChart.data.datasets[1].data = trapData;
        replayChart.data.datasets[2].data = signalData;

        // Build annotations
        var annotations = replayChart.options.plugins.annotation.annotations;

        // Quarter separators
        var qTimes = [0, 12, 24, 36, 48];
        qTimes.forEach(function (qm, i) {
          annotations['q' + (i + 1)] = {
            type: 'line',
            xMin: qm,
            xMax: qm,
            borderColor: 'rgba(85, 96, 122, 0.4)',
            borderWidth: 1,
            borderDash: [6, 4],
            label: {
              display: true,
              content: 'Q' + (i + 1),
              position: 'start',
              backgroundColor: 'rgba(13, 17, 28, 0.8)',
              color: '#55607a',
              font: { size: 9 },
            },
          };
        });

        // Trap danger zone (background band for trap_meter > 0.7)
        annotations['trap_danger'] = {
          type: 'box',
          yMin: 0,
          yMax: 1,
          xMin: 0,
          xMax: 48,
          backgroundColor: 'rgba(239, 68, 68, 0.03)',
          borderColor: 'rgba(239, 68, 68, 0.08)',
          borderWidth: 1,
          borderDash: [3, 3],
          drawTime: 'beforeDatasetsDraw',
          label: {
            display: true,
            content: 'DANGER ZONE',
            position: { x: 'start', y: 'end' },
            backgroundColor: 'rgba(239, 68, 68, 0.1)',
            color: 'rgba(239, 68, 68, 0.5)',
            font: { size: 8, weight: 'bold' },
          },
        };

        replayChart.update();
      }

      function updatePositionMarker() {
        if (!allFrames.length || !replayChart) return;
        var frame = allFrames[currentFrameIndex];
        var gameMinutes = computeGameMinutes(frame);

        var xScale = replayChart.scales.x;
        var xPx = xScale.getPixelForValue(gameMinutes);
        var chartArea = replayChart.chartArea;
        var relPct = ((xPx - chartArea.left) / (chartArea.right - chartArea.left)) * 100;
        dom.positionMarker.style.left = Math.max(0, Math.min(100, relPct)) + '%';
      }

      // ── Quarter Markers ────────────────────────────────────────

      function buildQuarterMarkers() {
        var container = dom.quarterMarkers;
        container.innerHTML = '';
        var quarters = ['Q1', 'Q2', 'Q3', 'Q4'];
        quarters.forEach(function (q, i) {
          var pct = ((i + 1) / 4) * 100;
          var marker = document.createElement('div');
          marker.className = 'quarter-marker';
          marker.style.left = pct + '%';
          marker.innerHTML = '<span class="quarter-marker-label">' + q + ' End</span>';
          container.appendChild(marker);
        });
      }

      // ── Playback Controls ──────────────────────────────────────

      function togglePlay() {
        if (!allFrames.length) return;
        if (isPlaying) { pausePlayback(); }
        else { startPlayback(); }
      }

      function startPlayback() {
        if (currentFrameIndex >= allFrames.length - 1) {
          currentFrameIndex = 0;
          displayFrame(0);
        }
        isPlaying = true;
        dom.btnPlayPause.textContent = '⏸ Pause';
        dom.btnPlayPause.classList.add('primary');
        runPlayLoop();
      }

      function pausePlayback() {
        isPlaying = false;
        dom.btnPlayPause.textContent = '▶ Play';
        dom.btnPlayPause.classList.add('primary');
        if (playTimer) {
          clearTimeout(playTimer);
          playTimer = null;
        }
      }

      function runPlayLoop() {
        if (!isPlaying || currentFrameIndex >= allFrames.length - 1) {
          if (currentFrameIndex >= allFrames.length - 1) {
            isPlaying = false;
            dom.btnPlayPause.textContent = '▶ Play';
            dom.btnPlayPause.classList.add('primary');
          }
          return;
        }

        displayFrame(currentFrameIndex + 1);

        var interval = Math.max(30, 330 / currentSpeed);
        playTimer = setTimeout(runPlayLoop, interval);
      }

      function stepForward() {
        if (currentFrameIndex < allFrames.length - 1) {
          if (isPlaying) pausePlayback();
          displayFrame(currentFrameIndex + 1);
        }
      }

      function stepBackward() {
        if (currentFrameIndex > 0) {
          if (isPlaying) pausePlayback();
          displayFrame(currentFrameIndex - 1);
        }
      }

      function setSpeed(speed) {
        currentSpeed = speed;
        dom.speedIndicator.textContent = currentSpeed.toFixed(1) + 'x';
        if (isPlaying) {
          pausePlayback();
          startPlayback();
        }
        document.querySelectorAll('.control-btn.speed-active').forEach(function (b) {
          b.classList.remove('speed-active');
        });
      }

      function jumpToQuarter(q) {
        if (isPlaying) pausePlayback();
        for (var i = 0; i < allFrames.length; i++) {
          var frameQ = safeGet(allFrames[i], 'metadata.quarter', 0);
          if (frameQ >= q) {
            displayFrame(i);
            break;
          }
        }
        document.querySelectorAll('.control-btn.q-active').forEach(function (b) {
          b.classList.remove('q-active');
        });
      }

      // ── Timeline Scrubbing ─────────────────────────────────────

      function initTimelineScrub() {
        var isDragging = false;

        dom.timelineContainer.addEventListener('mousedown', function (e) {
          isDragging = true;
          scrubToEvent(e);
        });

        document.addEventListener('mousemove', function (e) {
          if (isDragging) scrubToEvent(e);
        });

        document.addEventListener('mouseup', function () {
          isDragging = false;
        });

        function scrubToEvent(e) {
          if (!allFrames.length) return;
          if (isPlaying) pausePlayback();

          var rect = dom.timelineContainer.getBoundingClientRect();
          var pct = (e.clientX - rect.left) / rect.width;
          pct = Math.max(0, Math.min(1, pct));
          var idx = Math.round(pct * (allFrames.length - 1));
          displayFrame(idx);
        }
      }

      // ── Initialization ─────────────────────────────────────────

      function init() {
        buildQuarterMarkers();
        buildSignalLegend();
        initReplayChart();
        initTimelineScrub();

        // Load game from URL parameter or pick most recent ended game
        var params = new URLSearchParams(window.location.search);
        var gameIdParam = params.get('game_id');

        function loadGame(gid) {
          gameId = gid;
          var loadEl = document.createElement('div');
          loadEl.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--text-secondary);font-size:1.2rem;';
          loadEl.textContent = 'Loading replay data...';
          document.body.appendChild(loadEl);

          loadGameReplay(gid)
            .then(function (data) {
              allFrames = data.frames || data.snapshots || [];
              if (!allFrames.length) throw new Error('No frames');

              // Run signal detection
              detectSignals(allFrames);

              document.title = 'Replay: ' + gid;
              displayFrame(0);
              buildChartData();

              loadEl.remove();
            })
            .catch(function (err) {
              loadEl.textContent = 'Error: ' + err.message;
              console.error(err);
            });
        }

        if (gameIdParam) {
          loadGame(gameIdParam);
        } else {
          loadGamesList()
            .then(function (data) {
              var games = data.games || [];
              var ended = games.filter(function (g) { return g.status === 'ended'; });
              if (ended.length) {
                loadGame(ended[0].game_id);
              } else if (games.length) {
                loadGame(games[0].game_id);
              } else {
                dom.replayHomeScore.textContent = 'No games';
                dom.replayAwayScore.textContent = 'available';
              }
            })
            .catch(function (err) {
              console.error('Failed to load games list:', err);
              dom.replayHomeScore.textContent = 'Failed to load';
              dom.replayAwayScore.textContent = 'game data';
            });
        }

        // ── Bind Controls ──────────────────────────────────────

        dom.btnPlayPause.addEventListener('click', togglePlay);
        dom.btnStepFwd.addEventListener('click', stepForward);
        dom.btnStepBack.addEventListener('click', stepBackward);

        dom.btnFwd2.addEventListener('click', function () { setSpeed(2); });
        dom.btnFwd4.addEventListener('click', function () { setSpeed(4); });
        dom.btnFwd8.addEventListener('click', function () { setSpeed(8); });
        dom.btnRewind2.addEventListener('click', function () { setSpeed(2); });
        dom.btnRewind4.addEventListener('click', function () { setSpeed(4); });
        dom.btnRewind8.addEventListener('click', function () { setSpeed(8); });

        dom.btnQ1.addEventListener('click', function () { jumpToQuarter(1); });
        dom.btnQ2.addEventListener('click', function () { jumpToQuarter(2); });
        dom.btnQ3.addEventListener('click', function () { jumpToQuarter(3); });
        dom.btnQ4.addEventListener('click', function () { jumpToQuarter(4); });
        dom.btnOT.addEventListener('click', function () { jumpToQuarter(5); });

        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            stepForward();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            stepBackward();
          } else if (e.key === 'Home') {
            e.preventDefault();
            if (isPlaying) pausePlayback();
            displayFrame(0);
          } else if (e.key === 'End') {
            e.preventDefault();
            if (isPlaying) pausePlayback();
            displayFrame(allFrames.length - 1);
          }
        });
      }

      // ── Start ──────────────────────────────────────────────────

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
