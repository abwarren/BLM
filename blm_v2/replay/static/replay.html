<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLM V3 — Historical Dashboard</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* ── Design system ───────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deepest: #050812;  --bg-default: #0b1020;  --bg-elevated: #111827;
      --bg-card: #0f1628;     --bg-card-hover: #1a2235;
      --border: #1e2745;      --border-subtle: #161f35;
      --text-primary: #e2e8f0;--text-secondary: #8892b0;--text-muted: #4a5570;
      --accent: #00d4ff;      --accent2: #7c3aed;       --accent3: #f59e0b;
      --green: #10b981;       --red: #ef4444;           --orange: #f97316;
      --purple: #a855f7;      --pink: #ec4899;
      --font: -apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace;
      --radius: 8px;
    }
    html, body { height: 100%; background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font); overflow: hidden; }
    button { font-family: var(--font); cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-size: 11px; transition: all 0.15s; }
    select { font-family: var(--font); background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 11px; }
    input[type="text"], input[type="number"], input[type="datetime-local"] {
      font-family: var(--font); background: var(--bg-elevated); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 11px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deepest); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Layout ──────────────────────────────────────────────── */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--bg-default); border-bottom: 1px solid var(--border); min-height: 48px; flex-shrink: 0; }
    .topbar .brand { font-size: 14px; font-weight: 600; color: var(--accent); }
    .topbar .brand small { font-size: 10px; color: var(--text-muted); font-weight: 400; }
    .topbar .sep { width: 1px; height: 24px; background: var(--border); }
    .topbar select { min-width: 140px; }
    .topbar .stats { font-size: 10px; color: var(--text-muted); margin-left: auto; }

    .controls { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0; }
    .controls button { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
    .controls button:hover { background: var(--bg-card-hover); border-color: var(--accent); }
    .controls button.active { background: var(--accent); color: #000; }
    .controls button.danger { border-color: var(--red); color: var(--red); }
    .controls button.danger:hover { background: var(--red); color: #fff; }
    .controls label { font-size: 10px; color: var(--text-muted); }
    .controls .group { display: flex; align-items: center; gap: 4px; }
    .controls .sep { width: 1px; height: 20px; background: var(--border); }
    .controls .speed { width: 40px; text-align: center; font-size: 11px; color: var(--accent); font-weight: 600; }

    /* ── Chart area ──────────────────────────────────────────── */
    .chart-area { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    .chart-area.compact .chart-panel { min-height: 100px; }
    .chart-area.compact .chart-panel .chart-header { padding: 4px 8px; }

    .chart-panel { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius); min-height: 180px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .chart-panel:hover { border-color: var(--border); }
    .chart-panel.dimmed { opacity: 0.5; }
    .chart-panel.collapsed { min-height: 32px !important; }
    .chart-panel.collapsed .chart-container { display: none; }

    .chart-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; cursor: grab; }
    .chart-header:active { cursor: grabbing; }
    .chart-header .name { font-size: 11px; font-weight: 500; }
    .chart-header .name .unit { font-size: 9px; color: var(--text-muted); font-weight: 400; }
    .chart-header .value { margin-left: auto; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chart-header .actions { display: flex; gap: 2px; }
    .chart-header .actions button { padding: 2px 6px; font-size: 9px; background: transparent; color: var(--text-muted); }
    .chart-header .actions button:hover { color: var(--text-primary); background: var(--bg-card); }
    .chart-header .legend { font-size: 9px; display: flex; gap: 8px; margin-left: 8px; color: var(--text-muted); }
    .chart-header .legend span { display: flex; align-items: center; gap: 3px; }
    .chart-header .legend .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

    .chart-container { flex: 1; min-height: 0; }

    /* ── Tooltip (custom crosshair) ───────────────────────────── */
    .crosshair-tooltip { position: fixed; background: var(--bg-elevated); border: 1px solid var(--accent); border-radius: 4px; padding: 6px 10px; font-size: 10px; pointer-events: none; z-index: 1000; display: none; min-width: 120px; }
    .crosshair-tooltip .row { display: flex; justify-content: space-between; gap: 12px; }
    .crosshair-tooltip .label { color: var(--text-muted); }
    .crosshair-tooltip .time { color: var(--accent); font-weight: 500; margin-bottom: 3px; font-size: 11px; }

    /* ── Signal badges on timeline ────────────────────────────── */
    .signal-legend { display: flex; gap: 12px; padding: 4px 16px; flex-shrink: 0; background: var(--bg-default); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
    .signal-legend .sig { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-muted); }
    .signal-legend .sig .badge { width: 8px; height: 8px; border-radius: 50%; }

    /* ── Filters panel (slide-in) ─────────────────────────────── */
    .filter-panel { position: fixed; right: -320px; top: 0; bottom: 0; width: 300px; background: var(--bg-elevated); border-left: 1px solid var(--border); z-index: 500; transition: right 0.2s; padding: 16px; overflow-y: auto; }
    .filter-panel.open { right: 0; }
    .filter-panel h3 { font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 12px; }
    .filter-panel .field { margin-bottom: 10px; }
    .filter-panel .field label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    .filter-panel .field input, .filter-panel .field select { width: 100%; }
    .filter-panel .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: -1; display: none; }
    .filter-panel.open .overlay { display: block; }
    .filter-panel .apply-btn { width: 100%; margin-top: 12px; padding: 8px; background: var(--accent); color: #000; font-weight: 600; }
    .filter-panel .compare-toggle { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .filter-panel .compare-toggle input { width: auto; }

    /* ── Event timeline (bottom strip) ────────────────────────── */
    .event-strip { height: 28px; background: var(--bg-default); border-top: 1px solid var(--border-subtle); display: flex; align-items: center; padding: 0 16px; gap: 6px; overflow-x: auto; flex-shrink: 0; }
    .event-strip .event-marker { display: flex; align-items: center; gap: 3px; font-size: 9px; padding: 2px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
    .event-strip .event-marker:hover { filter: brightness(1.3); }
    .event-strip .event-marker .emoji { font-size: 10px; }

    /* ── Loading / Error ──────────────────────────────────────── */
    .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 13px; }
    .loading .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--red); padding: 20px; text-align: center; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      .topbar { flex-wrap: wrap; padding: 6px 10px; }
      .topbar .sep { display: none; }
      .chart-area { padding: 4px 6px; }
      .chart-panel { min-height: 120px; }
      .controls { padding: 4px 10px; }
    }

    /* ── Drag ghost ───────────────────────────────────────────── */
    .drag-ghost { position: fixed; pointer-events: none; opacity: 0.8; z-index: 9999; background: var(--bg-card); border: 1px solid var(--accent); border-radius: var(--radius); padding: 4px 12px; font-size: 11px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <div class="topbar">
    <span class="brand">BLM <small>v3 Historical</small></span>
    <div class="sep"></div>
    <select id="gameSelect"><option value="">— Select Game —</option></select>
    <div class="sep"></div>
    <button id="btnRefresh" title="Refresh game list">⟳</button>
    <button id="btnFilters" title="Research filters & comparison">⚙ Filters</button>
    <button id="btnExportPNG" title="Export dashboard as PNG">⬇ PNG</button>
    <span class="stats" id="statsBar">—</span>
  </div>

  <!-- Controls -->
  <div class="controls" id="controlsBar">
    <button id="btnPlay" title="Play/Pause">▶</button>
    <button id="btnStepBack" title="Step back one frame">◀</button>
    <button id="btnStepFwd" title="Step forward one frame">▶▶</button>
    <div class="sep"></div>
    <button id="btnSlowMo" title="Slow motion (0.5x)">½×</button>
    <span class="speed" id="speedDisplay">1×</span>
    <button id="btnFastFwd" title="Fast forward (4x)">4×</button>
    <div class="sep"></div>
    <label>Q:</label>
    <select id="quarterJump" style="width:50px">
      <option value="0">All</option><option>1</option><option>2</option><option>3</option><option>4</option>
    </select>
    <button id="btnJumpSignal" title="Jump to next signal">⛐ Signal</button>
    <button id="btnJumpEvent" title="Jump to next event">▸ Event</button>
    <div class="sep"></div>
    <label>Game:</label>
    <select id="compareGameSelect"><option value="">+ Compare</option></select>
    <button id="btnClearCompare" class="danger" title="Clear comparison games">✕ Clear</button>
  </div>

  <!-- Signal legend -->
  <div class="signal-legend" id="signalLegend"></div>

  <!-- Charts -->
  <div class="chart-area" id="chartArea">
    <div class="loading" id="loadingScreen"><div class="spinner"></div> Loading game data…</div>
  </div>

  <!-- Event strip -->
  <div class="event-strip" id="eventStrip"></div>

  <!-- Crosshair tooltip -->
  <div class="crosshair-tooltip" id="crosshairTooltip"><div class="time"></div></div>

  <!-- Filter panel -->
  <div class="filter-panel" id="filterPanel">
    <div class="overlay" id="filterOverlay"></div>
    <h3>Research Filters</h3>
    <div class="compare-toggle"><input type="checkbox" id="compareMode"> <label>Comparison Mode</label></div>
    <div class="field">
      <label>League</label>
      <select id="filterLeague"><option value="">All</option><option>Cyber 2K26</option></select>
    </div>
    <div class="field">
      <label>Quarter Range</label>
      <div style="display:flex;gap:4px">
        <input type="number" id="filterQMin" placeholder="Min" min="1" max="10" style="width:50%">
        <input type="number" id="filterQMax" placeholder="Max" min="1" max="10" style="width:50%">
      </div>
    </div>
    <div class="field">
      <label>Trap Meter Range</label>
      <div style="display:flex;gap:4px">
        <input type="number" id="filterTrapMin" placeholder="Min" min="0" max="100" style="width:50%">
        <input type="number" id="filterTrapMax" placeholder="Max" min="0" max="100" style="width:50%">
      </div>
    </div>
    <div class="field">
      <label>Confidence Range</label>
      <div style="display:flex;gap:4px">
        <input type="number" id="filterConfMin" placeholder="Min" min="0" max="1" step="0.1" style="width:50%">
        <input type="number" id="filterConfMax" placeholder="Max" min="0" max="1" step="0.1" style="width:50%">
      </div>
    </div>
    <div class="field">
      <label>Signal Type</label>
      <select id="filterSignalType">
        <option value="">All</option>
        <option>line_jump</option><option>line_freeze</option><option>odds_compression</option>
        <option>odds_expansion</option><option>sharp_movement</option><option>fake_movement</option>
        <option>trap_formation</option><option>bull_trap</option><option>bear_trap</option>
        <option>market_correction</option><option>overreaction</option><option>regression</option>
        <option>momentum_swing</option><option>pace_collapse</option><option>inflation_spike</option>
      </select>
    </div>
    <div class="field">
      <label>Outcome</label>
      <select id="filterOutcome"><option value="">All</option><option>over</option><option>under</option></select>
    </div>
    <div class="field">
      <label>Date Range</label>
      <div style="display:flex;gap:4px">
        <input type="datetime-local" id="filterDateFrom" style="width:50%">
        <input type="datetime-local" id="filterDateTo" style="width:50%">
      </div>
    </div>
    <div class="field">
      <label>Game ID</label>
      <input type="text" id="filterGameId" placeholder="e.g. test-game-001">
    </div>
    <button class="apply-btn" id="btnApplyFilters">Apply Filters</button>
  </div>
</div>
<script>
// ═════════════════════════════════════════════════════════════════════
// BLM V3 — Historical Research Dashboard
// ═════════════════════════════════════════════════════════════════════

// ── Chart configuration ─────────────────────────────────────────────
const CHART_PANELS = [
  { id: 'totalLine', name: 'Total Line', unit: 'pts', color: '#00d4ff',
    series: [
      { key: 'total_line', label: 'Market Line', color: '#00d4ff', width: 2 },
      { key: 'projected_total', label: 'Projected Total', color: '#7c3aed', width: 1.5, style: 2 },
      { key: 'fair_total', label: 'Fair Total', color: '#f59e0b', width: 1.5, style: 3 },
      { key: 'total_score', label: 'Actual Score', color: '#10b981', width: 1 },
    ] },
  { id: 'trapMeter', name: 'Trap Meter', unit: '', color: '#ef4444',
    series: [
      { key: 'trap_meter', label: 'Trap Meter', color: '#ef4444', width: 2 },
      { key: 'tt_modifier', label: 'TT Modifier', color: '#f97316', width: 1, style: 2 },
    ] },
  { id: 'pace', name: 'Pace', unit: 'pts/min', color: '#10b981',
    series: [
      { key: 'possessions_per_min', label: 'Pace', color: '#10b981', width: 2 },
      { key: 'projected_possessions', label: 'Proj Possessions', color: '#a3e635', width: 1, style: 2 },
    ] },
  { id: 'inflation', name: 'Inflation Index', unit: '', color: '#f59e0b',
    series: [
      { key: 'inflation_index', label: 'Inflation', color: '#f59e0b', width: 2 },
    ] },
  { id: 'confidence', name: 'Confidence', unit: '', color: '#a855f7',
    series: [
      { key: 'confidence', label: 'Confidence', color: '#a855f7', width: 2 },
    ] },
  { id: 'momentum', name: 'Momentum', unit: '', color: '#ec4899',
    series: [
      { key: 'momentum', label: 'Momentum', color: '#ec4899', width: 2 },
    ] },
  { id: 'regression', name: 'Regression Prob.', unit: '%', color: '#22d3ee',
    series: [
      { key: 'regression_prob', label: 'Regression', color: '#22d3ee', width: 2 },
    ] },
  { id: 'compression', name: 'Compression Index', unit: '', color: '#d946ef',
    series: [
      { key: 'compression_index', label: 'Compression', color: '#d946ef', width: 2 },
    ] },
  { id: 'teamTotals', name: 'Team Totals', unit: 'pts', color: '#22c55e',
    series: [
      { key: 'home_team_total', label: 'Home', color: '#22c55e', width: 2 },
      { key: 'away_team_total', label: 'Away', color: '#ef4444', width: 2 },
    ] },
];

const API_BASE = '/api/v2/historical';
const SIGNAL_COLORS = {
  line_freeze: '#6b7280', line_jump: '#ef4444', odds_compression: '#10b981',
  odds_expansion: '#f97316', sharp_movement: '#a855f7', fake_movement: '#6b7280',
  trap_formation: '#f59e0b', bull_trap: '#ef4444', bear_trap: '#7c3aed',
  market_correction: '#22d3ee', overreaction: '#ec4899', regression: '#10b981',
  momentum_swing: '#ec4899', pace_collapse: '#f97316', inflation_spike: '#f59e0b',
};
const SIGNAL_EMOJIS = {
  line_freeze: '⚫', line_jump: '🔴', odds_compression: '🟢', odds_expansion: '🟠',
  sharp_movement: '🟣', fake_movement: '⚫', trap_formation: '🟡', bull_trap: '🔴',
  bear_trap: '🟣', market_correction: '🟢', overreaction: '🔴', regression: '🟢',
  momentum_swing: '🟡', pace_collapse: '🟠', inflation_spike: '🟠',
};

// ── State ────────────────────────────────────────────────────────────
let state = {
  games: [],
  currentGameId: null,
  compareGameIds: [],
  snapshots: {},        // game_id → snapshot array
  signals: {},          // game_id → signal array
  events: {},           // game_id → event array
  charts: {},           // panel_id → { chart, series: {key: series} }
  visiblePanels: Object.fromEntries(CHART_PANELS.map(p => [p.id, true])),
  panelOrder: CHART_PANELS.map(p => p.id),
  playing: false,
  playbackSpeed: 1,
  currentFrame: 0,
  totalFrames: 0,
  filters: {},
  compareMode: false,
};

// ── API helpers ──────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const r = await fetch(`${API_BASE}${path}`, opts);
  if (!r.ok) throw new Error(`${r.status}: ${r.statusText}`);
  return r.json();
}

async function loadGames() {
  const data = await api('/games?limit=200');
  state.games = data.games || [];
  const sel = document.getElementById('gameSelect');
  sel.innerHTML = '<option value="">— Select Game —</option>' +
    state.games.map(g =>
      `<option value="${g.game_id}">${g.home_team} vs ${g.away_team} (${g.total_snapshots} snaps)</option>`
    ).join('');
  updateStats();
}

async function loadGameData(gameId) {
  const [snapshots, sigData, evtData, game] = await Promise.all([
    api(`/snapshots/${gameId}?limit=100000`),
    api(`/signals?game_id=${gameId}&limit=1000`),
    api(`/events/${gameId}?limit=500`),
    api(`/games/${gameId}`).catch(() => ({ game: {} })),
  ]);
  state.snapshots[gameId] = snapshots.snapshots || [];
  state.signals[gameId] = (sigData.signals || []).map(s => ({ ...s, gameId }));
  state.events[gameId] = (evtData.events || []).map(e => ({ ...e, gameId }));
  return game.game || {};
}

async function loadCompareGame(gameId) {
  if (state.snapshots[gameId]) return; // already loaded
  const [snapshots, sigData, evtData] = await Promise.all([
    api(`/snapshots/${gameId}?limit=100000`),
    api(`/signals?game_id=${gameId}&limit=1000`),
    api(`/events/${gameId}?limit=500`),
  ]);
  state.snapshots[gameId] = snapshots.snapshots || [];
  state.signals[gameId] = (sigData.signals || []).map(s => ({ ...s, gameId }));
  state.events[gameId] = (evtData.events || []).map(e => ({ ...e, gameId }));
}

// ── Chart rendering ──────────────────────────────────────────────────

function formatTime(ts) {
  if (!ts) return '';
  try { const d = new Date(ts); return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  catch { return ts; }
}

function timestampToUTC(ts) {
  if (!ts) return 0;
  return new Date(ts).getTime() / 1000;
}

function buildChartData(gameId, panel) {
  const snaps = state.snapshots[gameId];
  if (!snaps || snaps.length === 0) return {};

  const data = {};
  for (const s of panel.series) {
    const points = [];
    for (const snap of snaps) {
      const t = timestampToUTC(snap.timestamp);
      const v = snap[s.key];
      if (t > 0 && v !== null && v !== undefined && v !== '') {
        points.push({ time: t, value: parseFloat(v) });
      }
    }
    data[s.key] = points;
  }
  return data;
}

let chartTooltipTimer = null;

function createPanel(panelDef, index) {
  const container = document.getElementById('chartArea');
  const panel = document.createElement('div');
  panel.className = 'chart-panel';
  panel.dataset.panelId = panelDef.id;
  panel.draggable = false;

  // Header
  const header = document.createElement('div');
  header.className = 'chart-header';
  header.innerHTML = `
    <span class="name">${panelDef.name} <span class="unit">${panelDef.unit}</span></span>
    <span class="legend">${panelDef.series.map(s =>
      `<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`
    ).join('')}</span>
    <span class="value" id="val-${panelDef.id}">—</span>
    <span class="actions">
      <button class="btn-toggle" title="Toggle visibility">👁</button>
      <button class="btn-remove" title="Remove panel">✕</button>
    </span>
  `;
  panel.appendChild(header);

  // Chart container
  const chartDiv = document.createElement('div');
  chartDiv.className = 'chart-container';
  panel.appendChild(chartDiv);
  container.appendChild(panel);

  // Create chart
  const chart = LightweightCharts.createChart(chartDiv, {
    layout: {
      background: { type: 'solid', color: '#0f1628' },
      textColor: '#8892b0',
      fontSize: 10,
      fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace",
    },
    grid: {
      vertLines: { color: '#161f35' },
      horzLines: { color: '#161f35' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#00d4ff', width: 1, style: LightweightCharts.LineStyle.Dashed, labelBackgroundColor: '#00d4ff' },
      horzLine: { color: '#00d4ff44', width: 1, style: LightweightCharts.LineStyle.Dashed, labelBackgroundColor: '#00d4ff' },
    },
    timeScale: {
      borderColor: '#1e2745',
      timeVisible: true,
      secondsVisible: false,
      fixLeftEdge: true,
      fixRightEdge: false,
    },
    rightPriceScale: {
      borderColor: '#1e2745',
      scaleMargins: { top: 0.05, bottom: 0.1 },
    },
    handleScroll: { vertTouchDrag: false },
    handleScale: { axisPressedMouseMove: true },
  });

  // Series
  const seriesMap = {};
  for (const s of panelDef.series) {
    const ser = chart.addAreaSeries({
      lineColor: s.color,
      topColor: s.color + '33',
      bottomColor: s.color + '08',
      lineWidth: s.width || 2,
      lineStyle: s.style || 0,
      lastValueVisible: true,
      priceFormat: { type: 'custom', formatter: v => v != null ? v.toFixed(2) : '—' },
      autoscaleInfoProvider: () => null,
    });
    seriesMap[s.key] = ser;
  }

  // Store
  state.charts[panelDef.id] = { chart, series: seriesMap, panel: panelDef, panelEl: panel, chartDiv };

  // ── Crosshair sync ──────────────────────────────────────────
  chart.subscribeCrosshairMove(param => {
    if (!param.time) { document.getElementById('crosshairTooltip').style.display = 'none'; return; }
    const tt = document.getElementById('crosshairTooltip');
    const timeStr = formatTime(new Date(param.time * 1000).toISOString());
    tt.querySelector('.time').textContent = timeStr;

    // Build tooltip rows for this panel
    let rowsHtml = '';
    for (const s of panelDef.series) {
      if (param.seriesData && param.seriesData.get(seriesMap[s.key])) {
        const pt = param.seriesData.get(seriesMap[s.key]);
        const v = typeof pt.value === 'number' ? pt.value.toFixed(2) : '—';
        rowsHtml += `<div class="row"><span class="label" style="color:${s.color}">● ${s.label}</span><span>${v} ${panelDef.unit}</span></div>`;
      }
    }
    if (rowsHtml) {
      tt.innerHTML = `<div class="time">${timeStr}</div>${rowsHtml}`;
      // Also update all charts' crosshair positions (sync)
      for (const [pid, pc] of Object.entries(state.charts)) {
        if (pid !== panelDef.id) {
          pc.chart.setCrosshairPosition?.();
        }
      }
    }

    // Update value display
    const valEl = document.getElementById(`val-${panelDef.id}`);
    if (valEl && param.seriesData) {
      for (const s of panelDef.series) {
        const pt = param.seriesData.get(seriesMap[s.key]);
        if (pt && typeof pt.value === 'number') {
          valEl.textContent = `${s.label.split(' ')[0]}: ${pt.value.toFixed(1)}`;
          valEl.style.color = s.color;
          break;
        }
      }
    }

    // Sync all other charts to same time
    clearTimeout(chartTooltipTimer);
    chartTooltipTimer = setTimeout(() => {
      for (const [pid, pc] of Object.entries(state.charts)) {
        if (pid !== panelDef.id && param.time) {
          try { pc.chart.timeScale().scrollToPosition(-1, false); } catch {}
        }
      }
    }, 50);

    // Position tooltip
    tt.style.display = 'block';
    tt.style.left = (param.point?.x || 0) + 15 + 'px';
    tt.style.top = Math.max(10, (param.point?.y || 0) - 10) + 'px';
  });

  return { chart, seriesMap, panel };
}

function renderGame(gameId) {
  const area = document.getElementById('chartArea');
  const loading = document.getElementById('loadingScreen');
  if (loading) loading.remove();

  // Clear existing panels
  area.innerHTML = '';
  state.charts = {};

  // Determine which panels to render
  const panels = state.panelOrder
    .map(id => CHART_PANELS.find(p => p.id === id))
    .filter(p => p && state.visiblePanels[p.id]);

  for (const panelDef of panels) {
    const { chart, series: seriesMap } = createPanel(panelDef, panels.indexOf(panelDef));

    // Primary game data
    const primaryData = buildChartData(gameId, panelDef);
    for (const s of panelDef.series) {
      if (primaryData[s.key] && primaryData[s.key].length > 0) {
        seriesMap[s.key].setData(primaryData[s.key]);
      }
    }

    // Comparison game data (if any)
    for (const cid of state.compareGameIds) {
      if (cid === gameId) continue;
      const compData = buildChartData(cid, panelDef);
      for (const s of panelDef.series) {
        if (compData[s.key] && compData[s.key].length > 0) {
          const compSer = chart.addLineSeries({
            color: s.color + '88',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dotted,
            lastValueVisible: false,
          });
          compSer.setData(compData[s.key]);
          // Store so we can clear later
          if (!seriesMap[`comp:${s.key}`]) seriesMap[`comp:${s.key}`] = [];
          if (Array.isArray(seriesMap[`comp:${s.key}`])) {
            seriesMap[`comp:${s.key}`].push(compSer);
          }
        }
      }
    }

    // Event markers (as simple primitive markers)
    addSignalMarkers(gameId, panelDef, chart);
  }

  // Restore panel events
  setupPanelControls();
  buildSignalLegend();
  buildEventStrip(gameId);

  // Update total frames
  const snaps = state.snapshots[gameId] || [];
  state.totalFrames = snaps.length;
  state.currentFrame = snaps.length - 1;
  updateStats();
}

function addSignalMarkers(gameId, panelDef, chart) {
  const sigs = state.signals[gameId] || [];
  if (sigs.length === 0) return;

  const markers = [];
  for (const sig of sigs) {
    const t = timestampToUTC(sig.timestamp);
    if (t <= 0) continue;
    markers.push({
      time: t,
      position: sig.severity === 'high' || sig.severity === 'critical' ? 'aboveBar' : 'belowBar',
      color: SIGNAL_COLORS[sig.signal_type] || '#6b7280',
      shape: sig.severity === 'critical' ? 'arrowDown' : (sig.severity === 'high' ? 'arrowUp' : 'circle'),
      text: sig.signal_type.replace('_', ' ').slice(0, 8) + (sig.value != null ? ` ${sig.value.toFixed(1)}` : ''),
      size: sig.severity === 'critical' ? 2 : 1,
    });
  }

  // Add markers to the first series
  const firstKey = panelDef.series[0]?.key;
  if (firstKey && state.charts[panelDef.id]?.series[firstKey]) {
    state.charts[panelDef.id].series[firstKey].setMarkers(markers);
  }
}

function setupPanelControls() {
  document.querySelectorAll('.btn-toggle').forEach(btn => {
    btn.onclick = e => {
      const panel = e.target.closest('.chart-panel');
      panel.classList.toggle('collapsed');
      const chart = state.charts[panel.dataset.panelId]?.chart;
      if (chart) setTimeout(() => chart.timeScale().fitContent(), 100);
    };
  });
  document.querySelectorAll('.btn-remove').forEach(btn => {
    btn.onclick = e => {
      const panel = e.target.closest('.chart-panel');
      const id = panel.dataset.panelId;
      state.visiblePanels[id] = false;
      panel.remove();
    };
  });
}

// ── Signal legend ────────────────────────────────────────────────────
function buildSignalLegend() {
  const el = document.getElementById('signalLegend');
  el.innerHTML = Object.entries(SIGNAL_EMOJIS).map(([type, emoji]) =>
    `<span class="sig"><span class="badge" style="background:${SIGNAL_COLORS[type]||'#666'}"></span>${emoji} ${type.replace('_',' ')}</span>`
  ).join('');
}

// ── Event strip ──────────────────────────────────────────────────────
function buildEventStrip(gameId) {
  const el = document.getElementById('eventStrip');
  el.innerHTML = '';
  const evts = state.events[gameId] || [];
  if (evts.length === 0) {
    el.innerHTML = '<span style="color:var(--text-muted);font-size:10px">No events</span>';
    return;
  }
  for (const evt of evts.slice(0, 30)) {
    const m = document.createElement('span');
    m.className = 'event-marker';
    m.style.background = SIGNAL_COLORS[evt.event_type] || '#333';
    m.innerHTML = `<span class="emoji">${SIGNAL_EMOJIS[evt.event_type] || '▸'}</span> ${evt.event_type.replace('_',' ')}`;
    m.title = evt.description || '';
    m.onclick = () => jumpToTime(timestampToUTC(evt.timestamp));
    el.appendChild(m);
  }
}

// ── Playback ─────────────────────────────────────────────────────────
function jumpToTime(time) {
  for (const [pid, pc] of Object.entries(state.charts)) {
    try { pc.chart.timeScale().scrollToRealTime(); } catch {}
    try { pc.chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, time - 600), to: time + 60 }); } catch {}
  }
}

function jumpToFrame(frameIdx) {
  const gameId = state.currentGameId;
  if (!gameId) return;
  const snaps = state.snapshots[gameId] || [];
  if (frameIdx < 0 || frameIdx >= snaps.length) return;
  state.currentFrame = frameIdx;
  const snap = snaps[frameIdx];
  if (!snap) return;
  const t = timestampToUTC(snap.timestamp);
  jumpToTime(t);
  updateStats();
}

function togglePlay() {
  state.playing = !state.playing;
  document.getElementById('btnPlay').textContent = state.playing ? '⏸' : '▶';
  if (state.playing) startPlayback();
}

let playbackInterval = null;
function startPlayback() {
  if (playbackInterval) clearInterval(playbackInterval);
  const interval = Math.max(100, 1000 / state.playbackSpeed);
  playbackInterval = setInterval(() => {
    if (!state.playing) { clearInterval(playbackInterval); playbackInterval = null; return; }
    const gameId = state.currentGameId;
    if (!gameId) { state.playing = false; document.getElementById('btnPlay').textContent = '▶'; return; }
    const snaps = state.snapshots[gameId] || [];
    let next = state.currentFrame + 1;
    if (next >= snaps.length) { state.playing = false; document.getElementById('btnPlay').textContent = '▶'; clearInterval(playbackInterval); playbackInterval = null; return; }
    jumpToFrame(next);
  }, interval);
}

function setSpeed(speed) {
  state.playbackSpeed = speed;
  document.getElementById('speedDisplay').textContent = speed + '×';
  if (state.playing) { startPlayback(); }
}

// ── Filters ──────────────────────────────────────────────────────────
function openFilters() {
  document.getElementById('filterPanel').classList.toggle('open');
}

async function applyFilters() {
  const filters = {};
  const league = document.getElementById('filterLeague').value;
  if (league) filters.league = league;
  const qMin = document.getElementById('filterQMin').value;
  const qMax = document.getElementById('filterQMax').value;
  if (qMin) filters.quarter_min = parseInt(qMin);
  if (qMax) filters.quarter_max = parseInt(qMax);
  const tMin = document.getElementById('filterTrapMin').value;
  const tMax = document.getElementById('filterTrapMax').value;
  if (tMin) filters.trap_min = parseFloat(tMin);
  if (tMax) filters.trap_max = parseFloat(tMax);
  const cMin = document.getElementById('filterConfMin').value;
  const cMax = document.getElementById('filterConfMax').value;
  if (cMin) filters.confidence_min = parseFloat(cMin);
  if (cMax) filters.confidence_max = parseFloat(cMax);
  const outcome = document.getElementById('filterOutcome').value;
  if (outcome) filters.result = outcome;
  const signalType = document.getElementById('filterSignalType').value;
  if (signalType) filters.signal_type = signalType;
  const gameId = document.getElementById('filterGameId').value;
  if (gameId) filters.game_id = gameId;

  state.filters = filters;

  const compareMode = document.getElementById('compareMode').checked;
  state.compareMode = compareMode;

  document.getElementById('filterPanel').classList.remove('open');

  // If compare mode, load all matching games
  if (compareMode && Object.keys(filters).length > 0) {
    try {
      const result = await api('/compare/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(filters),
      });
      const matched = result.matched_games || [];
      if (matched.length > 0) {
        const ids = matched.map(g => g.id).filter(Boolean);
        state.compareGameIds = ids.slice(0, 5); // max 5 compare games
        for (const id of ids.slice(0, 5)) {
          await loadCompareGame(id);
        }
        if (state.currentGameId) renderGame(state.currentGameId);
      }
    } catch (e) {
      console.error('Compare query failed:', e);
    }
  }
}

// ── Export ───────────────────────────────────────────────────────────
async function exportPNG() {
  const area = document.getElementById('chartArea');
  try {
    const canvas = await html2canvas(area, {
      backgroundColor: '#050812',
      useCORS: true,
      logging: false,
      scale: 2,
    });
    const link = document.createElement('a');
    link.download = `blm-dashboard-${state.currentGameId || 'export'}.png`;
    link.href = canvas.toDataURL();
    link.click();
  } catch (e) {
    console.error('PNG export failed:', e);
  }
}

// ── Stats update ─────────────────────────────────────────────────────
function updateStats() {
  const gameId = state.currentGameId;
  const snaps = state.snapshots[gameId] || [];
  const sigs = state.signals[gameId] || [];
  const evts = state.events[gameId] || [];
  const el = document.getElementById('statsBar');
  el.textContent = snaps.length > 0
    ? `${snaps.length} snaps · ${sigs.length} signals · ${evts.length} events · frame ${state.currentFrame + 1}/${state.totalFrames}`
    : `${state.games.length} games loaded`;
}

// ── Event bindings ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadGames();

  document.getElementById('gameSelect').addEventListener('change', async e => {
    const gid = e.target.value;
    if (!gid) return;
    state.currentGameId = gid;
    document.getElementById('loadingScreen')?.remove();
    // Show loading
    const area = document.getElementById('chartArea');
    area.innerHTML = '<div class="loading"><div class="spinner"></div> Loading game…</div>';
    state.charts = {};
    state.compareGameIds = [];
    try {
      await loadGameData(gid);
      renderGame(gid);
    } catch (err) {
      area.innerHTML = `<div class="error">Error: ${err.message}</div>`;
    }
  });

  document.getElementById('btnRefresh').onclick = loadGames;
  document.getElementById('btnFilters').onclick = openFilters;
  document.getElementById('filterOverlay').onclick = () => document.getElementById('filterPanel').classList.remove('open');
  document.getElementById('btnApplyFilters').onclick = applyFilters;

  document.getElementById('btnExportPNG').onclick = exportPNG;
  document.getElementById('btnPlay').onclick = togglePlay;
  document.getElementById('btnStepBack').onclick = () => jumpToFrame(state.currentFrame - 1);
  document.getElementById('btnStepFwd').onclick = () => jumpToFrame(state.currentFrame + 1);
  document.getElementById('btnSlowMo').onclick = () => setSpeed(state.playbackSpeed <= 1 ? 0.5 : state.playbackSpeed / 2);
  document.getElementById('btnFastFwd').onclick = () => setSpeed(state.playbackSpeed >= 8 ? 8 : state.playbackSpeed * 2);

  document.getElementById('quarterJump').addEventListener('change', e => {
    const q = parseInt(e.target.value);
    if (!q) return;
    const snaps = state.snapshots[state.currentGameId] || [];
    const idx = snaps.findIndex(s => s.quarter >= q);
    if (idx >= 0) jumpToFrame(idx);
  });

  document.getElementById('btnJumpSignal').onclick = () => {
    const sigs = state.signals[state.currentGameId] || [];
    const curT = timestampToUTC(state.snapshots[state.currentGameId]?.[state.currentFrame]?.timestamp);
    const next = sigs.find(s => timestampToUTC(s.timestamp) > curT);
    if (next) jumpToTime(timestampToUTC(next.timestamp));
  };

  document.getElementById('btnJumpEvent').onclick = () => {
    const evts = state.events[state.currentGameId] || [];
    const curT = timestampToUTC(state.snapshots[state.currentGameId]?.[state.currentFrame]?.timestamp);
    const next = evts.find(e => timestampToUTC(e.timestamp) > curT);
    if (next) jumpToTime(timestampToUTC(next.timestamp));
  };

  // Load compare game list
  (async () => {
    try {
      const data = await api('/games?limit=100');
      const sel = document.getElementById('compareGameSelect');
      for (const g of data.games || []) {
        const opt = document.createElement('option');
        opt.value = g.game_id;
        opt.textContent = `${g.home_team} vs ${g.away_team}`;
        sel.appendChild(opt);
      }
    } catch {}
  })();

  document.getElementById('compareGameSelect').addEventListener('change', async e => {
    const gid = e.target.value;
    if (!gid || gid === state.currentGameId) return;
    if (!state.compareGameIds.includes(gid)) {
      state.compareGameIds.push(gid);
      await loadCompareGame(gid);
    }
    if (state.currentGameId) renderGame(state.currentGameId);
    e.target.value = '';
  });

  document.getElementById('btnClearCompare').onclick = () => {
    state.compareGameIds = [];
    if (state.currentGameId) renderGame(state.currentGameId);
  };

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight') jumpToFrame(state.currentFrame + 1);
    if (e.key === 'ArrowLeft') jumpToFrame(state.currentFrame - 1);
  });

  // Drag-to-reorder (simple click-drag panels)
  let dragTarget = null, dragClone = null;
  document.addEventListener('mousedown', e => {
    const header = e.target.closest('.chart-header');
    if (!header || e.target.closest('.actions')) return;
    const panel = header.closest('.chart-panel');
    if (!panel) return;
    dragTarget = panel;
    dragClone = panel.cloneNode(true);
    dragClone.style.position = 'fixed';
    dragClone.style.pointerEvents = 'none';
    dragClone.style.opacity = '0.5';
    dragClone.style.width = panel.offsetWidth + 'px';
    dragClone.style.zIndex = '9999';
    dragClone.style.transform = 'rotate(1deg)';
    document.body.appendChild(dragClone);
  });
  document.addEventListener('mousemove', e => {
    if (!dragClone) return;
    dragClone.style.left = e.clientX - 20 + 'px';
    dragClone.style.top = e.clientY - 20 + 'px';
    // Highlight drop zone
    document.querySelectorAll('.chart-panel').forEach(p => p.style.borderColor = 'var(--border-subtle)');
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.chart-panel');
    if (target && target !== dragTarget) target.style.borderColor = '#00d4ff';
  });
  document.addEventListener('mouseup', e => {
    if (dragClone) { dragClone.remove(); dragClone = null; }
    if (!dragTarget) return;
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.chart-panel');
    if (target && target !== dragTarget) {
      const area = document.getElementById('chartArea');
      const parent = target.parentNode;
      const children = Array.from(area.children);
      const fromIdx = children.indexOf(dragTarget);
      const toIdx = children.indexOf(target);
      if (fromIdx >= 0 && toIdx >= 0) {
        if (fromIdx < toIdx) {
          target.after(dragTarget);
        } else {
          target.before(dragTarget);
        }
        // Update panel order
        const newOrder = Array.from(area.children).map(c => c.dataset.panelId).filter(Boolean);
        state.panelOrder = newOrder;
      }
    }
    document.querySelectorAll('.chart-panel').forEach(p => p.style.borderColor = 'var(--border-subtle)');
    dragTarget = null;
  });
});
</script>
</body>
</html>
